name: Update Gopher X Metro analytics

# Weekly: pull last-7-days page views from Cloudflare Web Analytics into docs/data/analytics.json.
on:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch analytics
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 .github/scripts/analytics.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/analytics.json
          git diff --staged --quiet || (git commit -m "Update analytics" && git push)
