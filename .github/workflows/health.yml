name: Portfolio health check

# Weekly: every live site loads, its data is fresh, and the portfolio's links aren't broken.
on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sites up and data fresh
        run: python .github/scripts/health.py
      - name: Broken links on the portfolio
        if: always()
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude linkedin.com docs/index.html
          fail: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: health-report
          path: health_report.md
          if-no-files-found: ignore

  alert-on-failure:
    needs: health
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Portfolio health check failed (${new Date().toISOString().slice(0,10)})`,
              body: `A site is down, stale, or has broken links. Details in the run log:\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['stale-data'],
            });

  # This repo rarely gets commits; stop GitHub disabling the cron after 60 days.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Re-enabling the workflow resets GitHub's 60-day inactivity timer.
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/health.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
